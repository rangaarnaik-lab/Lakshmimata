name: Daily FII/DII Fetch

on:
  schedule:
    # ~6:15 PM IST = 12:45 PM UTC (Mon-Fri, after NSE provisional publish)
    - cron: '45 12 * * 1-5'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Backfill prior sessions (0 = today only, 30 ≈ 1M, 126 ≈ 6M trading days)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '30'
          - '126'

jobs:
  fetch-fii-dii:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch FII/DII from NSE and upsert to Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.backfill_days }}" != "" ] && [ "${{ github.event.inputs.backfill_days }}" != "0" ]; then
            ARGS="--backfill-days ${{ github.event.inputs.backfill_days }}"
          fi
          python scripts/fetch_fii_dii.py $ARGS
