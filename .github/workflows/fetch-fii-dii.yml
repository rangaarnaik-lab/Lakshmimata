name: Daily FII/DII Fetch

on:
  schedule:
    # ~6:15 PM IST = 12:45 PM UTC (Mon-Fri, after NSE provisional publish)
    - cron: '45 12 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-fii-dii:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Fetch FII/DII from NSE and upsert to Supabase
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/fetch_fii_dii.py
