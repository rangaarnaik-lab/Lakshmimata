name: Push worker patch to lakshmimata-server main

# Applies deploy/about-results-key-rotation-7468.patch to lakshmimata-server
# and pushes main (Railway fundamentals auto-redeploys on push).
#
# One-time setup: Lakshmimata repo → Settings → Secrets → Actions
#   LAKSHMIMATA_SERVER_PAT = classic GitHub PAT (repo scope) for rangaarnaik-lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/about-results-key-rotation-7468.patch'
      - '.github/workflows/push-server-worker-patch.yml'

jobs:
  push-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Lakshmimata (patch)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout lakshmimata-server main
        uses: actions/checkout@v4
        with:
          repository: rangaarnaik-lab/lakshmimata-server
          path: server
          ref: main
          persist-credentials: false

      - name: Apply worker patch and push main
        env:
          PAT: ${{ secrets.LAKSHMIMATA_SERVER_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Add LAKSHMIMATA_SERVER_PAT to Lakshmimata secrets — a classic GitHub PAT with repo scope (write access to lakshmimata-server)."
            exit 1
          fi
          git -C server apply ../deploy/about-results-key-rotation-7468.patch
          cd server
          git config user.name "rangaarnaik-lab"
          git config user.email "41898282+rangaarnaik-lab@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "Patch already applied on lakshmimata-server main — nothing to push."
            exit 0
          fi
          git add fundamentals_worker.py
          git commit -m "Rotate all Gemini keys on 429 for About and Results"
          # Force push via PAT — do not use github-actions[bot] GITHUB_TOKEN from checkout.
          git -c credential.helper= remote set-url origin \
            "https://x-access-token:${PAT}@github.com/rangaarnaik-lab/lakshmimata-server.git"
          git -c credential.helper= push origin HEAD:main
