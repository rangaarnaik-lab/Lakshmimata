name: Push worker patch to lakshmimata-server main

# Applies deploy/*.patch files to lakshmimata-server and pushes main.
# Railway fundamentals auto-redeploys on push.
#
# One-time setup: Lakshmimata repo → Settings → Secrets → Actions
#   LAKSHMIMATA_SERVER_PAT = classic GitHub PAT (repo scope) for rangaarnaik-lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/*.patch'
      - '.github/workflows/push-server-worker-patch.yml'

jobs:
  push-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Lakshmimata (patches)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout lakshmimata-server main
        uses: actions/checkout@v4
        with:
          repository: rangaarnaik-lab/lakshmimata-server
          path: server
          ref: main
          persist-credentials: false

      - name: Apply server patches and push main
        env:
          PAT: ${{ secrets.LAKSHMIMATA_SERVER_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::Add LAKSHMIMATA_SERVER_PAT to Lakshmimata secrets — a classic GitHub PAT with repo scope (write access to lakshmimata-server)."
            exit 1
          fi
          applied=0
          for patch in deploy/*.patch; do
            [ -f "$patch" ] || continue
            echo "Applying $patch ..."
            if git -C server apply "$patch" 2>/dev/null; then
              applied=1
              echo "  applied OK"
            else
              echo "  skip (already on server main or not applicable)"
            fi
          done
          cd server
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No server changes to push."
            exit 0
          fi
          git add -A
          git commit -m "Apply server patches from Lakshmimata deploy/"
          git -c credential.helper= remote set-url origin \
            "https://x-access-token:${PAT}@github.com/rangaarnaik-lab/lakshmimata-server.git"
          git -c credential.helper= push origin HEAD:main
          echo "Pushed lakshmimata-server main (applied_patches=$applied)"
